name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # v4-hooks-public nests 17 repos; only v4-core and v4-periphery are needed
      - name: Install dependencies
        run: |
          git submodule update --init lib/forge-std lib/v4-hooks-public
          git -C lib/v4-hooks-public submodule update --init --depth 1 lib/v4-periphery
          git -C lib/v4-hooks-public submodule update --init --recursive --depth 1 lib/v4-core

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
